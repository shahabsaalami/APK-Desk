name: Build Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m unittest -v test_apk_desk
      - name: Build executable
        shell: powershell
        run: .\Build.ps1
      - name: Package and publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "APKDesk-$env:RELEASE_TAG-Windows-x64.zip"
          Compress-Archive -LiteralPath APKDesk.exe, Install-ContextMenu.ps1, Remove-ContextMenu.ps1, README.md -DestinationPath $zip
          $notes = "Windows x64 portable application. Python is bundled; Android SDK Build-Tools and Java are required for APK inspection and signature verification. Extract the ZIP to a permanent folder and use the app's Install context menu button."
          $notes | Set-Content -LiteralPath release-notes.txt -Encoding utf8
          gh release create $env:RELEASE_TAG $zip --verify-tag --title "APK Desk $env:RELEASE_TAG" --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
